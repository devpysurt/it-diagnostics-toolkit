<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title description">
  <title id="title">IT Diagnostics Toolkit: synthetic DNS incident overview</title>
  <desc id="description">Illustration of a fictional diagnostic report: seven checks, five OK and two failed. DNS resolution fails and the TCP probe is blocked at its DNS stage. This is not a browser screenshot.</desc>
  <rect width="1120" height="630" rx="18" fill="#f2f6f8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#286577">IT DIAGNOSTICS TOOLKIT / 0.1.0</text>
    <text x="42" y="99" font-size="36" font-weight="700" fill="#17313c">From symptom to evidence.</text>
    <text x="42" y="130" font-size="16" fill="#526670">Fictional DNS incident · report data overview</text>
    <rect x="876" y="43" width="202" height="37" rx="8" fill="#e3ecf5"/>
    <text x="977" y="67" text-anchor="middle" font-size="12" font-weight="700" fill="#285379">SYNTHETIC EXAMPLE</text>
    <g transform="translate(42 165)">
      <rect width="246" height="90" rx="10" fill="#fff" stroke="#dce5e8"/>
      <text x="20" y="46" font-size="32" font-weight="700" fill="#176748">5</text><text x="20" y="71" font-size="12" font-weight="700" fill="#176748">OK</text>
      <rect x="264" width="246" height="90" rx="10" fill="#fff" stroke="#dce5e8"/>
      <text x="284" y="46" font-size="32" font-weight="700" fill="#835503">0</text><text x="284" y="71" font-size="12" font-weight="700" fill="#835503">WARNING</text>
      <rect x="528" width="246" height="90" rx="10" fill="#fff" stroke="#dce5e8"/>
      <text x="548" y="46" font-size="32" font-weight="700" fill="#a33229">2</text><text x="548" y="71" font-size="12" font-weight="700" fill="#a33229">FAIL</text>
      <rect x="792" width="244" height="90" rx="10" fill="#fff" stroke="#dce5e8"/>
      <text x="812" y="46" font-size="32" font-weight="700" fill="#4d626d">0</text><text x="812" y="71" font-size="12" font-weight="700" fill="#4d626d">SKIP</text>
    </g>
    <rect x="42" y="280" width="688" height="130" rx="10" fill="#fff" stroke="#dce5e8"/>
    <rect x="62" y="300" width="52" height="25" rx="5" fill="#fbe6e4"/><text x="88" y="317" text-anchor="middle" font-size="11" font-weight="700" fill="#a33229">FAIL</text>
    <text x="127" y="318" font-size="17" font-weight="700" fill="#17313c">DNS: support.example.test</text>
    <text x="62" y="350" font-size="15" fill="#17313c">Name resolution failed.</text>
    <text x="62" y="380" font-size="14" fill="#526670">Next: verify hostname, resolver settings and VPN context.</text>
    <rect x="42" y="428" width="688" height="130" rx="10" fill="#fff" stroke="#dce5e8"/>
    <rect x="62" y="448" width="52" height="25" rx="5" fill="#fbe6e4"/><text x="88" y="465" text-anchor="middle" font-size="11" font-weight="700" fill="#a33229">FAIL</text>
    <text x="127" y="466" font-size="17" font-weight="700" fill="#17313c">TCP: support.example.test:443</text>
    <text x="62" y="498" font-size="15" fill="#17313c">Probe blocked at the DNS stage.</text>
    <text x="62" y="528" font-size="14" fill="#526670">Next: restore name resolution, then retest connectivity.</text>
    <rect x="750" y="280" width="328" height="278" rx="10" fill="#17313c"/>
    <text x="774" y="318" font-size="18" font-weight="700" fill="#fff">Built for support workflows</text>
    <text x="774" y="358" font-size="15" fill="#d8e7ec">Read-only checks</text>
    <text x="774" y="390" font-size="15" fill="#d8e7ec">Configurable thresholds</text>
    <text x="774" y="422" font-size="15" fill="#d8e7ec">Actionable findings</text>
    <text x="774" y="454" font-size="15" fill="#d8e7ec">Offline HTML + JSON</text>
    <text x="774" y="504" font-size="13" fill="#aac7d0">Observe → investigate → verify</text>
    <text x="42" y="599" font-size="12" fill="#526670">Illustration from demo data. No live system measurements. No settings changed.</text>
  </g>
</svg>
