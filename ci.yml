name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install ".[dev]"
      - name: Run unit and local integration tests
        run: python -m pytest -q
      - name: Exercise installed CLI
        run: python -m it_diagnostics --demo healthy --output-dir reports --fail-on warning
      - name: Smoke test local collectors
        run: python -m it_diagnostics --output-dir reports
